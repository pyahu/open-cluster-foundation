minimumKubernetesVersion: "1.30"
e2e:
  kubernetesVersion: "1.36.1"
  kindNodeImage: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
notes:
  - Chart versions are pinned. App versions document the upstream application version exposed by the chart when available.
  - Release manifests are pinned to immutable upstream release tags.
  - When a product release is newer than the latest non-deprecated chart, this blueprint follows the chart-supported appVersion instead of overriding images out of band.
  - Fields annotated with "# renovate:" are updated automatically by Renovate. Unannotated versions (kafkaVersion, debezium, appVersion documentation fields) are updated manually.
