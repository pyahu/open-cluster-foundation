reloader:
  reloadStrategy: annotations
  watchGlobally: true
  ignoreJobs: true
  ignoreCronJobs: true
  enableHA: true
  deployment:
    replicas: 2
    # Uso medido: ~44Mi.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
