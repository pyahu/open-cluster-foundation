# O chart nao declara resources por padrao, o que deixa o scheduler cego e, num
# no sob pressao, o processo perde CPU e para de responder as probes.
resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    memory: 400Mi

# O default do chart usa timeoutSeconds: 1, agressivo demais: sob contencao o
# liveness mata o pod no meio do boot e ele entra em CrashLoopBackOff (visto no
# cluster da Unilog em 2026-08-10). O startupProbe cobre a inicializacao e os
# timeouts maiores toleram um no ocupado.
startupProbe:
  failureThreshold: 30
  periodSeconds: 5
livenessProbe:
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  timeoutSeconds: 5
  failureThreshold: 5
