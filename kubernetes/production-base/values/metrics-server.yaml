# The chart declares no resources by default, which leaves the scheduler blind;
# on a node under pressure the process is starved of CPU and stops answering
# its probes.
resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    memory: 400Mi

# The chart default is timeoutSeconds: 1, which is too aggressive: under
# contention the liveness probe kills the pod mid-boot and it lands in
# CrashLoopBackOff (seen on a production cluster on 2026-08-10). The
# startupProbe covers initialisation and the longer timeouts tolerate a busy
# node.
startupProbe:
  failureThreshold: 30
  periodSeconds: 5
livenessProbe:
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  timeoutSeconds: 5
  failureThreshold: 5
