resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP

deploymentStrategy:
  type: Recreate

assertNoLeakedSecrets: false

envFromSecrets:
  - name: grafana-oidc-credentials

grafana.ini:
  server:
    root_url: https://grafana.example.com
  auth:
    disable_login_form: true
  auth.generic_oauth:
    enabled: true
    name: OIDC
    allow_sign_up: true
    scopes: openid profile email groups offline_access
    auth_url: https://idp.example.com/oauth/v2/authorize
    token_url: https://idp.example.com/oauth/v2/token
    api_url: https://idp.example.com/oidc/v1/userinfo
    client_id: ${client_id}
    client_secret: ${client_secret}
    use_pkce: true
    use_refresh_token: true
    role_attribute_strict: true
    role_attribute_path: contains(groups[*], 'grafana-admin') && 'Admin' || contains(groups[*], 'grafana-editor') && 'Editor' || contains(groups[*], 'grafana-viewer') && 'Viewer' || 'None'
    allow_assign_grafana_admin: false

datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 30s
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              url: $${__value.raw}
              datasourceUid: tempo
              urlDisplayLabel: View trace
            - name: TraceIDInLine
              matcherRegex: '"trace\.id":"([a-f0-9]+)"'
              url: $${__value.raw}
              datasourceUid: tempo
              urlDisplayLabel: View trace
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            customQuery: true
            query: '{app="$${__span.tags["service.name"]}"} | trace_id=`$${__trace.traceId}`'
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  datasources:
    enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes-views
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes-views
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/platform

dashboards:
  kubernetes-views:
    k8s-views-global:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    k8s-views-namespaces:
      gnetId: 15758
      revision: 46
      datasource: Prometheus
    k8s-views-nodes:
      gnetId: 15759
      revision: 40
      datasource: Prometheus
    k8s-views-pods:
      gnetId: 15760
      revision: 39
      datasource: Prometheus
    k8s-system-api-server:
      gnetId: 15761
      revision: 21
      datasource: Prometheus
  platform:
    envoy-gateway-overview:
      gnetId: 24460
      revision: 1
      datasource: Prometheus
    blackbox-http:
      gnetId: 13659
      revision: 1
      datasource: Prometheus
    rabbitmq-overview:
      gnetId: 10991
      revision: 15
      datasource: Prometheus
    redis-exporter:
      gnetId: 763
      revision: 6
      datasource: Prometheus
    cert-manager:
      gnetId: 20340
      revision: 1
      datasource: Prometheus
    argocd:
      gnetId: 14584
      revision: 1
      datasource: Prometheus

serviceMonitor:
  enabled: true

persistence:
  enabled: true
  size: 10Gi
