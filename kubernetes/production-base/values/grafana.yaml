# Uso medido: ~348Mi.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP

# O chart barra grafana.ini com chave client_secret mesmo quando o valor é
# expansão de env (${...}); as credenciais reais vêm do secret via envFromSecrets.
assertNoLeakedSecrets: false

envFromSecrets:
  - name: grafana-oidc-credentials

grafana.ini:
  server:
    root_url: https://grafana.prod.unilog.cloud
  auth:
    disable_login_form: false
  auth.generic_oauth:
    enabled: true
    name: Zitadel
    allow_sign_up: true
    # Org unilog-engineering no Zitadel da Pyahu — o scope de org restringe o
    # login a usuários dela; todo engenheiro é admin (time de 2, sem RBAC).
    scopes: openid profile email urn:zitadel:iam:org:id:385995099135279505
    auth_url: https://zitadel.de.pyahu.cloud/oauth/v2/authorize
    token_url: https://zitadel.de.pyahu.cloud/oauth/v2/token
    api_url: https://zitadel.de.pyahu.cloud/oidc/v1/userinfo
    client_id: ${client_id}
    client_secret: ${client_secret}
    role_attribute_path: "'GrafanaAdmin'"
    allow_assign_grafana_admin: true

# Os datasources provisionados sao read-only e o Grafana falha o boot com
# "data source not found" ao trocar o uid de um que ja existe. deleteDatasources
# remove a versao antiga (uid aleatorio) antes de recriar com o uid fixo.
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3100

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
  datasources:
    enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes-views
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes-views

# Community Kubernetes dashboards from dotdc/grafana-dashboards-kubernetes,
# pinned by grafana.com dashboard id and revision.
dashboards:
  kubernetes-views:
    k8s-views-global:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    k8s-views-namespaces:
      gnetId: 15758
      revision: 46
      datasource: Prometheus
    k8s-views-nodes:
      gnetId: 15759
      revision: 40
      datasource: Prometheus
    k8s-views-pods:
      gnetId: 15760
      revision: 39
      datasource: Prometheus
    k8s-system-api-server:
      gnetId: 15761
      revision: 21
      datasource: Prometheus

serviceMonitor:
  enabled: true

persistence:
  enabled: true
  size: 10Gi
