# Measured usage: ~348Mi.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP

# The data volume is ReadWriteOnce. With the default RollingUpdate the new pod
# waits for a volume the old pod still holds, never becomes ready, and an atomic
# helm upgrade times out and rolls back. Recreate trades a few seconds of
# Grafana for an upgrade that completes.
deploymentStrategy:
  type: Recreate

# The chart rejects grafana.ini with a client_secret key even when the value
# is an env expansion (${...}); the real credentials come from the secret via
# envFromSecrets.
assertNoLeakedSecrets: false

envFromSecrets:
  - name: grafana-oidc-credentials

# Instance-specific settings (public URL, OIDC issuer, org scope) belong in
# values/local/grafana.yaml, which is gitignored and layered on top of this
# file by helmfile when present. The values below are placeholders that keep
# the release installable; override them there, not here.
grafana.ini:
  server:
    root_url: https://grafana.example.com
  auth:
    disable_login_form: false
  auth.generic_oauth:
    enabled: true
    name: OIDC
    allow_sign_up: true
    # Append a tenant scope when the issuer supports it, for example
    # "urn:zitadel:iam:org:id:<org-id>" on ZITADEL, to restrict sign-in to one
    # organization.
    scopes: openid profile email
    auth_url: https://idp.example.com/oauth/v2/authorize
    token_url: https://idp.example.com/oauth/v2/token
    api_url: https://idp.example.com/oidc/v1/userinfo
    client_id: ${client_id}
    client_secret: ${client_secret}
    # Every signed-in user becomes a Grafana admin. Tighten role_attribute_path
    # once the cluster has more than a handful of operators.
    role_attribute_path: "'GrafanaAdmin'"
    allow_assign_grafana_admin: true

# Provisioned datasources are read-only, and Grafana fails to boot with
# "data source not found" when the uid of an existing one changes.
# deleteDatasources removes the old (random-uid) copy before recreating it
# with the fixed uid.
datasources:
  datasources.yaml:
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Loki
        orgId: 1
      - name: Tempo
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 30s
          # A histogram sample carrying a trace_id exemplar links to that trace.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.monitoring.svc.cluster.local
        jsonData:
          maxLines: 1000
          derivedFields:
            # The trace_id Alloy stores as structured metadata (JSON logs).
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              url: $${__value.raw}
              datasourceUid: tempo
              urlDisplayLabel: View trace
            # An ECS line whose trace id was not lifted into metadata.
            - name: TraceIDInLine
              matcherRegex: '"trace\.id":"([a-f0-9]+)"'
              url: $${__value.raw}
              datasourceUid: tempo
              urlDisplayLabel: View trace
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3100
        jsonData:
          # `$$` keeps provisioning from reading the template tokens as
          # environment variables.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            customQuery: true
            query: '{app="$${__span.tags["service.name"]}"} | trace_id=`$${__trace.traceId}`'
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
      # Lets Grafana's Alerting page show and silence what Alertmanager holds.
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false

sidecar:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  dashboards:
    enabled: true
    searchNamespace: ALL
    # A dashboard ConfigMap chooses its folder with this annotation
    # (resources/monitoring/dashboards-platform.yaml uses "Platform").
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  datasources:
    enabled: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: kubernetes-views
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes-views
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/platform

# Community Kubernetes dashboards from dotdc/grafana-dashboards-kubernetes,
# pinned by grafana.com dashboard id and revision.
dashboards:
  kubernetes-views:
    k8s-views-global:
      gnetId: 15757
      revision: 43
      datasource: Prometheus
    k8s-views-namespaces:
      gnetId: 15758
      revision: 46
      datasource: Prometheus
    k8s-views-nodes:
      gnetId: 15759
      revision: 40
      datasource: Prometheus
    k8s-views-pods:
      gnetId: 15760
      revision: 39
      datasource: Prometheus
    k8s-system-api-server:
      gnetId: 15761
      revision: 21
      datasource: Prometheus
  # Edge and synthetic checks. Envoy Gateway's own overview dashboard, and the
  # HTTP view of the blackbox exporter (fed by Probe resources).
  platform:
    envoy-gateway-overview:
      gnetId: 24460
      revision: 1
      datasource: Prometheus
    blackbox-http:
      gnetId: 13659
      revision: 1
      datasource: Prometheus

serviceMonitor:
  enabled: true

persistence:
  enabled: true
  size: 10Gi
