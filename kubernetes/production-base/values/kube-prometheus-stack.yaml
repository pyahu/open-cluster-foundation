# The foundation applies the Prometheus Operator CRDs before any chart
# installs (see versions.yaml prometheusOperatorCrds), so the chart must not
# fight over their field ownership.
crds:
  enabled: false

grafana:
  enabled: false
  # Grafana itself is installed by the separate grafana release, but the
  # kube-prometheus-stack dashboards are still deployed as ConfigMaps so the
  # Grafana sidecar can pick them up.
  forceDeployDashboards: true

defaultRules:
  create: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    retention: 120h
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s
    walCompression: true
    # Measured usage: ~1.15Gi per replica with 15d retention.
    resources:
      requests:
        cpu: 200m
        memory: 1536Mi
      limits:
        memory: 3Gi
    enableAdminAPI: false
    # Tempo's metrics generator writes span metrics and the service graph here.
    # The receiver accepts writes from any pod that reaches port 9090, so keep
    # the monitoring namespace off the tenant network paths.
    enableRemoteWriteReceiver: true
    # Exemplars carry a trace_id next to a histogram sample, which is what lets
    # Grafana jump from a latency spike to the trace behind it.
    enableFeatures:
      - exemplar-storage
    exemplars:
      maxSize: 100000
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Without these, Probe and ScrapeConfig resources need the chart's release
    # label to be picked up, unlike every other monitoring resource here.
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  admissionWebhooks:
    patch:
      enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi
