prometheus:
  prometheusSpec:
    retention: 30d

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-receivers
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        - receiver: apps
          matchers:
            - namespace =~ "my-app-namespace-.*"
            - severity =~ "warning|critical"
        - receiver: platform
          matchers: ['severity =~ "warning|critical"']
    receivers:
      - name: 'null'
      - name: apps
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-receivers/slack-webhook-url
            channel: '#my-app-alerts'
            send_resolved: true
      - name: platform
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-receivers/telegram-bot-token
            chat_id: 0
            parse_mode: HTML
            send_resolved: true
