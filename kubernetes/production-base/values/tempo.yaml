tempo:
  retention: 168h
  # Span metrics (request rate, errors and duration per service and operation)
  # and the service graph, written to Prometheus. They are what make traces
  # searchable by symptom and what draw the service map in Grafana.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    storage:
      path: /var/tempo/generator/wal
    traces_storage:
      path: /var/tempo/generator/traces
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  receivers:
    otlp:
      protocols:
        grpc: {}
        http: {}

persistence:
  enabled: true
  size: 20Gi

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
