# Curated from the cert-manager mixin (monitoring.mixins.dev/cert-manager).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: production-base
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertManagerAbsent
          expr: absent(up{job="cert-manager"})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'Cert Manager has disappeared from Prometheus service discovery'
            description: 'New certificates will not be able to be minted, and existing ones cannot be renewed.'
            runbook_url: https://gitlab.com/uneeq-oss/cert-manager-mixin/-/blob/master/RUNBOOK.md#certmanagerabsent
        - alert: CertManagerCertExpirySoon
          expr: |
            avg by (exported_namespace, namespace, name) (
              certmanager_certificate_expiration_timestamp_seconds - time()
            ) < (21 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'The cert {{ $labels.name }} is 21 days from expiry, it should have renewed over a week ago'
            description: 'The certificate {{ $labels.name }} in namespace {{ $labels.exported_namespace }} expires in less than 21 days and has not been renewed automatically.'
            runbook_url: https://gitlab.com/uneeq-oss/cert-manager-mixin/-/blob/master/RUNBOOK.md#certmanagercertexpirysoon
        - alert: CertManagerCertNotReady
          expr: |
            max by (name, exported_namespace, namespace, condition) (
              certmanager_certificate_ready_status{condition="False"}
            ) == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'The cert {{ $labels.name }} is not ready to serve traffic'
            description: 'The certificate {{ $labels.name }} in namespace {{ $labels.exported_namespace }} has not become Ready; requests using it may fail once the current secret expires.'
            runbook_url: https://gitlab.com/uneeq-oss/cert-manager-mixin/-/blob/master/RUNBOOK.md#certmanagercertnotready
        - alert: CertManagerHittingRateLimits
          expr: |
            sum by (host, path) (
              rate(certmanager_http_acme_client_request_count{status="429"}[5m])
            ) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'Cert manager hitting LetsEncrypt rate limits'
            description: 'Depending on the rate limit, cert-manager may be unable to issue or renew certificates for up to a week.'
            runbook_url: https://gitlab.com/uneeq-oss/cert-manager-mixin/-/blob/master/RUNBOOK.md#certmanagerhittingratelimits
