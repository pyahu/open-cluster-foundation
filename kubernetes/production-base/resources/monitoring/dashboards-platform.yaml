# Platform dashboards authored for this base (the community ones are pulled by
# gnetId in values/grafana.yaml). Picked up by the Grafana sidecar from any
# namespace; the grafana_folder annotation files them under "Platform".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ocf-capacity
  namespace: monitoring
  labels:
    app.kubernetes.io/name: production-base
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Platform
data:
  ocf-capacity.json: |-
    {
      "uid": "ocf-capacity",
      "title": "Capacity",
      "tags": [
        "platform",
        "capacity"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Nodes",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Memory used per node",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "description": "Real usage. Above ~85% the kernel starts reclaiming and pods get OOM-killed or evicted."
        },
        {
          "type": "timeseries",
          "title": "Memory requested vs allocatable per node",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"memory\"}) / sum by (node) (kube_node_status_allocatable{resource=\"memory\"})",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {},
          "description": "What the scheduler has promised. Near 100% nothing new fits on the node, whatever the real usage says."
        },
        {
          "type": "timeseries",
          "title": "CPU used per node",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "{{instance}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "min": 0
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "CPU requested vs allocatable per node",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (node) (kube_pod_container_resource_requests{resource=\"cpu\"}) / sum by (node) (kube_node_status_allocatable{resource=\"cpu\"})",
              "legendFormat": "{{node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "row",
          "title": "Namespaces",
          "id": 6,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Memory working set by namespace",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (namespace) (container_memory_working_set_bytes{container!=\"\"}))",
              "legendFormat": "{{namespace}}",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": true
            }
          }
        },
        {
          "type": "bargauge",
          "title": "CPU used by namespace",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])))",
              "legendFormat": "{{namespace}}",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": true
            }
          }
        },
        {
          "type": "row",
          "title": "Storage",
          "id": 9,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "title": "Volume usage",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": true
            }
          },
          "description": "Used over the capacity actually bound, which can be larger than requested when the provider has a minimum volume size."
        },
        {
          "type": "row",
          "title": "Stability",
          "id": 11,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "panels": []
        },
        {
          "type": "table",
          "title": "OOM kills in the last 24h",
          "id": 12,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 38
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (namespace, pod, container) (increase(container_oom_events_total[24h])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "table",
          "title": "Container restarts in the last hour",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 38
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h])) > 0)",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        }
      ],
      "annotations": {
        "list": []
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ocf-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: production-base
    grafana_dashboard: '1'
  annotations:
    grafana_folder: Platform
data:
  ocf-alerts.json: |-
    {
      "uid": "ocf-alerts",
      "title": "Alerts",
      "tags": [
        "platform",
        "alerts"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Critical firing",
          "id": 1,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"critical\",alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "stat",
          "title": "Warning firing",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"warning\",alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "stat",
          "title": "Info firing",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(ALERTS{alertstate=\"firing\",severity=\"info\",alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "description": "Info alerts never page; they are here for context."
        },
        {
          "type": "stat",
          "title": "Pending",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(ALERTS{alertstate=\"pending\",alertname!~\"Watchdog|InfoInhibitor\"}) or vector(0)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {},
          "description": "Condition true but still inside its `for:` window."
        },
        {
          "type": "table",
          "title": "Firing now",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (severity, alertname, namespace) (ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"}))",
              "legendFormat": "",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Firing over time by severity",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count by (severity) (ALERTS{alertstate=\"firing\",alertname!~\"Watchdog|InfoInhibitor\"})",
              "legendFormat": "{{severity}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {}
        }
      ],
      "annotations": {
        "list": []
      }
    }
