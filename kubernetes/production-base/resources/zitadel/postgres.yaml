apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-postgres
  namespace: identity
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm
  storage:
    size: 50Gi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
