apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infisical
spec:
  parentRefs:
    - name: {{ .Values.platform.gateway.name }}
      namespace: {{ .Values.platform.gateway.namespace }}
      sectionName: {{ .Values.platform.gateway.sectionName }}
  hostnames:
    - {{ .Values.platform.hostname | quote }}
  rules:
    - backendRefs:
        - name: infisical-infisical-standalone-infisical
          port: 8080
