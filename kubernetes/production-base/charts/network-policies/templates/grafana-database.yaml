{{- if .Values.grafanaDatabaseCidrs }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocf-grafana-database
  namespace: monitoring
  labels:
    app.kubernetes.io/name: ocf-network-policies
    app.kubernetes.io/part-of: open-cluster-foundation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    - to:
{{- range .Values.grafanaDatabaseCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
