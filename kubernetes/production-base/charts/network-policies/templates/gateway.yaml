apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocf-public-gateway-ingress
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: ocf-network-policies
    app.kubernetes.io/part-of: open-cluster-foundation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 10080
        - protocol: TCP
          port: 10443
        - protocol: TCP
          port: 19003
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocf-public-gateway-backends
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/name: ocf-network-policies
    app.kubernetes.io/part-of: open-cluster-foundation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              open-cluster-foundation.io/gateway-access: public
