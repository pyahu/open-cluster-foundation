apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thanos-compactor
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.compactor.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.compactor.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-compactor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compactor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: compactor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: compactor
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "thanos.podSecurityContext" . | nindent 8 }}
      containers:
        - name: thanos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - compact
            - --wait
            - --data-dir=/var/thanos/compact
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:10902
            - --retention.resolution-raw={{ .Values.compactor.retention.raw }}
            - --retention.resolution-5m={{ .Values.compactor.retention.fiveMinutes }}
            - --retention.resolution-1h={{ .Values.compactor.retention.oneHour }}
          ports:
            - name: http
              containerPort: 10902
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            {{- toYaml .Values.compactor.resources | nindent 12 }}
          securityContext:
            {{- include "thanos.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: object-storage
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/compact
      volumes:
        - name: object-storage
          secret:
            secretName: {{ .Values.objectStorageSecret.name }}
            items:
              - key: {{ .Values.objectStorageSecret.key }}
                path: objstore.yml
        - name: data
          persistentVolumeClaim:
            claimName: thanos-compactor
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-compactor
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compactor
spec:
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: compactor
  ports:
    - name: http
      port: 10902
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos-compactor
  namespace: {{ .Release.Namespace }}
  labels:
    open-cluster-foundation.io/monitor: trusted
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: compactor
  endpoints:
    - port: http
      interval: 30s
