apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-query-endpoints
  namespace: {{ .Release.Namespace }}
data:
  endpoints.yaml: |
    endpoints:
      - address: kube-prometheus-stack-thanos-discovery.{{ .Release.Namespace }}.svc.cluster.local:10901
      - address: thanos-store.{{ .Release.Namespace }}.svc.cluster.local:10901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: query
spec:
  replicas: {{ .Values.query.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: query
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: query
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "thanos.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "thanos.topologySpreadConstraints" "query" | nindent 8 }}
      containers:
        - name: thanos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - query
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
            - --endpoint.sd-config-file=/etc/thanos/endpoints.yaml
            - --query.replica-label=prometheus_replica
          ports:
            - name: http
              containerPort: 10902
            - name: grpc
              containerPort: 10901
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            {{- toYaml .Values.query.resources | nindent 12 }}
          securityContext:
            {{- include "thanos.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: endpoints
              mountPath: /etc/thanos
              readOnly: true
      volumes:
        - name: endpoints
          configMap:
            name: thanos-query-endpoints
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: query
spec:
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: query
  ports:
    - name: http
      port: 10902
      targetPort: http
    - name: grpc
      port: 10901
      targetPort: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thanos-query
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ sub .Values.query.replicas 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: query
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos-query
  namespace: {{ .Release.Namespace }}
  labels:
    open-cluster-foundation.io/monitor: trusted
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: query
  endpoints:
    - port: http
      interval: 30s
