apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: store
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: store
  ports:
    - name: http
      port: 10902
      targetPort: http
    - name: grpc
      port: 10901
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-store
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: store
spec:
  serviceName: thanos-store
  replicas: {{ .Values.store.replicas }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: store
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "thanos.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "thanos.topologySpreadConstraints" "store" | nindent 8 }}
      containers:
        - name: thanos
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - store
            - --data-dir=/var/thanos/store
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --http-address=0.0.0.0:10902
            - --grpc-address=0.0.0.0:10901
          ports:
            - name: http
              containerPort: 10902
            - name: grpc
              containerPort: 10901
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            {{- toYaml .Values.store.resources | nindent 12 }}
          securityContext:
            {{- include "thanos.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: object-storage
              mountPath: /etc/thanos
              readOnly: true
            - name: data
              mountPath: /var/thanos/store
      volumes:
        - name: object-storage
          secret:
            secretName: {{ .Values.objectStorageSecret.name }}
            items:
              - key: {{ .Values.objectStorageSecret.key }}
                path: objstore.yml
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.store.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.store.persistence.size }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: thanos-store
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ sub .Values.store.replicas 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: store
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: thanos-store
  namespace: {{ .Release.Namespace }}
  labels:
    open-cluster-foundation.io/monitor: trusted
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: store
  endpoints:
    - port: http
      interval: 30s
