# Bootstrap placeholder, applied only when the cluster does not yet have a
# GatewayClass/Gateway (see apply_base_gateway in scripts/k8s-production-base.sh).
#
# Production instances customize both resources, and that customization MUST
# NOT be overwritten:
#   - the GatewayClass gets a parametersRef pointing to an EnvoyProxy carrying
#     the provider's load balancer annotations;
#   - the Gateway gets one HTTPS listener per hostname, with the certificates.
# Reapplying this file on top makes the data plane Service lose its
# annotations, the cloud controller provision a new load balancer with a new
# IP, and all HTTPS traffic drop, since DNS still points at the old IP.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
  labels:
    app.kubernetes.io/name: production-base
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: platform-system
  labels:
    app.kubernetes.io/name: production-base
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
