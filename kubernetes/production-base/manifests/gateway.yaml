# Placeholder de bootstrap, aplicado apenas quando o cluster ainda nao tem
# GatewayClass/Gateway (ver apply_base_gateway em scripts/k8s-production-base.sh).
#
# Instancias de producao personalizam os dois recursos e essa customizacao NAO
# deve ser sobrescrita:
#   - GatewayClass ganha um parametersRef apontando para um EnvoyProxy com as
#     annotations do load balancer do provedor;
#   - Gateway ganha um listener HTTPS por hostname, com os certificados.
# Reaplicar este arquivo por cima faz o Service do data plane perder as
# annotations, o cloud controller provisionar um load balancer novo com IP novo
# e todo o trafego HTTPS cair, ja que o DNS continua no IP antigo.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
  labels:
    app.kubernetes.io/name: production-base
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: platform-system
  labels:
    app.kubernetes.io/name: production-base
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
