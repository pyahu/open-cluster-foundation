apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: e2e-postgres
  namespace: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: e2e-postgres-store
  storage:
    size: 1Gi
