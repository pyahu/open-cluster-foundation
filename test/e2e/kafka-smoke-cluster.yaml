apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  namespace: messaging
  labels:
    strimzi.io/cluster: foundation-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 640Mi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Gi
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: foundation-kafka
  namespace: messaging
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.2.0
    jvmOptions:
      "-Xms": 128m
      "-Xmx": 256m
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      auto.create.topics.enable: "false"
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
  entityOperator:
    topicOperator:
      jvmOptions:
        "-Xms": 64m
        "-Xmx": 128m
      livenessProbe:
        initialDelaySeconds: 120
        timeoutSeconds: 10
      readinessProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 10
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
    userOperator:
      jvmOptions:
        "-Xms": 64m
        "-Xmx": 128m
      livenessProbe:
        initialDelaySeconds: 120
        timeoutSeconds: 10
      readinessProbe:
        initialDelaySeconds: 30
        timeoutSeconds: 10
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: e2e-events
  namespace: messaging
  labels:
    strimzi.io/cluster: foundation-kafka
spec:
  topicName: e2e-events
  partitions: 1
  replicas: 1
