# Echo workload routed through the public Gateway: the end-to-end proof that
# LoadBalancer -> Envoy -> HTTPRoute -> Service -> Pod works. Lives in the
# default namespace, which enforces the restricted Pod Security Standard.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-echo
  namespace: default
  labels:
    app.kubernetes.io/name: e2e-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-echo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          command: ["/agnhost", "netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-echo
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: e2e-echo
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2e-echo
  namespace: default
spec:
  parentRefs:
    - name: public-gateway
      namespace: platform-system
      sectionName: http
  hostnames:
    - e2e.example.com
  rules:
    - backendRefs:
        - name: e2e-echo
          port: 80
