apiVersion: v1
kind: Secret
metadata:
  name: e2e-s3
  namespace: data
type: Opaque
stringData:
  ACCESS_KEY_ID: ocf-e2e-access
  ACCESS_SECRET_KEY: ocf-e2e-secret-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-s3
  namespace: data
  labels:
    app.kubernetes.io/name: e2e-s3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-s3
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versitygw
          image: docker.io/versity/versitygw:v1.9.0@sha256:eb7f786fcd91e72194e48fcf1ac16302d686bf8e3a71434bdbc067a6efd3fdc7
          command:
            - /bin/sh
            - -c
          args:
            - mkdir -p /data/cnpg-backups && exec versitygw --port :9000 --health /health posix /data
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: e2e-s3
                  key: ACCESS_KEY_ID
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: e2e-s3
                  key: ACCESS_SECRET_KEY
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-s3
  namespace: data
spec:
  selector:
    app.kubernetes.io/name: e2e-s3
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: e2e-postgres-store
  namespace: data
spec:
  configuration:
    destinationPath: s3://cnpg-backups/
    endpointURL: http://e2e-s3.data.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: e2e-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: e2e-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
