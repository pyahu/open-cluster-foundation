apiVersion: v1
kind: Secret
metadata:
  name: e2e-minio
  namespace: data
type: Opaque
stringData:
  ACCESS_KEY_ID: ocf-e2e-access
  ACCESS_SECRET_KEY: ocf-e2e-secret-key
  MINIO_ROOT_USER: ocf-e2e-access
  MINIO_ROOT_PASSWORD: ocf-e2e-secret-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-minio
  namespace: data
  labels:
    app.kubernetes.io/name: e2e-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: e2e-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          args:
            - server
            - /data
            - --address=:9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: e2e-minio
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e2e-minio
                  key: MINIO_ROOT_PASSWORD
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: e2e-minio
  namespace: data
spec:
  selector:
    app.kubernetes.io/name: e2e-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-minio-bucket
  namespace: data
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-minio-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          command:
            - /bin/sh
            - -c
          args:
            - mc --config-dir /tmp/.mc alias set e2e http://e2e-minio.data.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc --config-dir /tmp/.mc mb --ignore-existing e2e/cnpg-backups
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: e2e-minio
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: e2e-minio
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: e2e-postgres-store
  namespace: data
spec:
  configuration:
    destinationPath: s3://cnpg-backups/
    endpointURL: http://e2e-minio.data.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: e2e-minio
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: e2e-minio
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
