apiVersion: v1
kind: Namespace
metadata:
  name: e2e-untrusted
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: e2e-untrusted
  namespace: e2e-untrusted
spec:
  parentRefs:
    - name: public-gateway
      namespace: platform-system
      sectionName: http
  hostnames:
    - untrusted.e2e.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
